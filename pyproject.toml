[project]
name = "market-analyzer-agents"
version = "0.1.0"
description = "A Beijing-time portfolio research agent for A-share and US equity markets."
requires-python = ">=3.9"
dependencies = []

[project.scripts]
marketanalyzeragents = "marketanalyzeragents.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
