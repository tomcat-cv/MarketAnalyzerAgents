[project]
name = "dailyresearch"
version = "0.1.0"
description = "A Codex-friendly daily research brief agent without Claude or n8n."
requires-python = ">=3.9"
dependencies = []

[project.scripts]
dailyresearch = "dailyresearch.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
