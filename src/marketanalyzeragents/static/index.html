<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Market Analyzer</title>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <header>
    <div>
      <h1>Market Analyzer</h1>
      <div class="subtle" id="clock">正在读取本地配置</div>
    </div>
    <div class="status-strip" id="market-status"></div>
  </header>
  <nav class="tabs" aria-label="主页面">
    <button class="tab-button active" data-tab="home" type="button">首页</button>
    <button class="tab-button" data-tab="archive" type="button">历史归档</button>
    <button class="tab-button" data-tab="config" type="button">配置</button>
  </nav>
  <main>
    <div class="tab-panel" id="tab-home">
      <div class="overview-grid" id="overview"></div>
      <div class="home-grid">
        <section>
          <div class="section-head">
            <h2>当天市场分析报告</h2>
            <button id="run-report" type="button">立即生成</button>
          </div>
          <article class="markdown-body" id="latest-report"></article>
        </section>
        <aside>
          <section>
            <div class="section-head">
              <h2>盘中操作建议</h2>
              <button class="secondary" id="run-suggestion" type="button">刷新建议</button>
            </div>
            <div class="alerts" id="suggestions"></div>
          </section>
          <section>
            <div class="section-head">
              <h2>持仓与 Topic</h2>
              <span class="subtle" id="tracking-count"></span>
            </div>
            <div id="tracking"></div>
          </section>
        </aside>
      </div>
    </div>
    <div class="tab-panel" id="tab-archive" hidden>
      <section>
        <div class="section-head">
          <h2>历史报告</h2>
          <span class="subtle">state/analysis/reports</span>
        </div>
        <div class="brief-list" id="reports"></div>
      </section>
    </div>
    <div class="tab-panel" id="tab-config" hidden>
      <div class="config-grid">
        <div>
          <section>
            <div class="section-head">
              <h2>分析模型</h2>
              <span class="subtle">config/settings.json</span>
            </div>
            <form id="model-form">
              <div class="form-grid">
                <div>
                  <label>报告后端</label>
                  <select name="backend">
                    <option value="zhipu">智谱</option>
                    <option value="openai">OpenAI</option>
                    <option value="dry-run">Dry run</option>
                  </select>
                </div>
                <div>
                  <label>当前模型</label>
                  <input name="model" placeholder="glm-5.1 / gpt-5.4">
                </div>
                <div>
                  <label>智谱模型</label>
                  <input name="zhipu_model" placeholder="glm-5.1">
                </div>
                <div>
                  <label>OpenAI 模型</label>
                  <input name="openai_model" placeholder="gpt-5.4">
                </div>
                <div>
                  <label>盘中建议后端</label>
                  <select name="advice_backend">
                    <option value="zhipu">智谱</option>
                    <option value="openai">OpenAI</option>
                    <option value="dry-run">Dry run</option>
                  </select>
                </div>
                <div>
                  <label>讨论轮数</label>
                  <input name="debate_rounds" type="number" min="1" max="3" step="1">
                </div>
                <div>
                  <label>默认报告时间</label>
                  <input name="report_schedule" placeholder="08:00, 14:00, 20:00">
                </div>
                <div>
                  <label>盘中建议间隔秒数</label>
                  <input name="intraday_suggestion_interval_seconds" type="number" min="60" step="60">
                </div>
              </div>
              <div class="actions">
                <button type="submit">保存模型</button>
              </div>
            </form>
          </section>
          <section>
            <div class="section-head">
              <h2>持仓配置</h2>
              <span class="subtle" id="holding-config-count"></span>
            </div>
            <form id="holding-form">
              <div class="form-grid">
                <div>
                  <label>市场</label>
                  <select name="market">
                    <option value="us_equities">美股</option>
                    <option value="a_share">A 股</option>
                  </select>
                </div>
                <div>
                  <label>代码</label>
                  <input name="ticker" required>
                </div>
                <div>
                  <label>行情代码</label>
                  <input name="symbol">
                </div>
                <div>
                  <label>名称</label>
                  <input name="company">
                </div>
                <div class="wide">
                  <label>相关主题</label>
                  <textarea name="themes" placeholder="AI 算力&#10;出口管制"></textarea>
                </div>
              </div>
              <div class="actions">
                <button class="secondary" type="reset">清空</button>
                <button type="submit">保存持仓</button>
              </div>
            </form>
            <div id="holding-config-list"></div>
          </section>
        </div>
        <div>
          <section>
            <div class="section-head">
              <h2>资讯与社媒来源</h2>
              <span class="subtle">官方资讯 / X / 小红书</span>
            </div>
            <form id="source-form">
              <div class="form-grid">
                <div class="wide">
                  <label>官方 RSS 来源，每行：名称 | URL | 主题逗号分隔</label>
                  <textarea name="official_sources"></textarea>
                </div>
                <div>
                  <label>X 关键词</label>
                  <textarea name="x_keywords"></textarea>
                </div>
                <div>
                  <label>X 博主</label>
                  <textarea name="x_accounts"></textarea>
                </div>
                <div>
                  <label>X 适配器</label>
                  <select name="x_adapter">
                    <option value="disabled">未启用</option>
                    <option value="manual">手动帖子</option>
                  </select>
                </div>
                <div class="wide">
                  <label>X 手动帖子，每行：作者 | 发布时间 | 情绪 | URL | 正文</label>
                  <textarea name="x_manual_posts"></textarea>
                </div>
                <div>
                  <label>小红书关键词</label>
                  <textarea name="xiaohongshu_keywords"></textarea>
                </div>
                <div>
                  <label>小红书博主</label>
                  <textarea name="xiaohongshu_accounts"></textarea>
                </div>
                <div>
                  <label>小红书适配器</label>
                  <select name="xiaohongshu_adapter">
                    <option value="disabled">未启用</option>
                    <option value="manual">手动帖子</option>
                  </select>
                </div>
                <div class="wide">
                  <label>小红书手动帖子，每行：作者 | 发布时间 | 情绪 | URL | 正文</label>
                  <textarea name="xiaohongshu_manual_posts"></textarea>
                </div>
                <div>
                  <label>恐惧贪婪指数</label>
                  <input name="fear_value" placeholder="0-100">
                </div>
                <div>
                  <label>指数标签</label>
                  <input name="fear_label" placeholder="Fear / Neutral / Greed">
                </div>
                <div class="wide">
                  <label>指数来源链接</label>
                  <input name="fear_source_url" placeholder="https://www.cnn.com/markets/fear-and-greed">
                </div>
              </div>
              <div class="actions">
                <button type="submit">保存来源</button>
              </div>
            </form>
          </section>
          <section>
            <div class="section-head">
              <h2>关注 Topic</h2>
              <span class="subtle" id="topic-config-count"></span>
            </div>
            <form id="topic-form">
              <div class="form-grid">
                <div>
                  <label>ID</label>
                  <input name="id" required>
                </div>
                <div>
                  <label>名称</label>
                  <input name="name">
                </div>
                <div class="wide">
                  <label>关键词</label>
                  <textarea name="keywords"></textarea>
                </div>
              </div>
              <div class="actions">
                <button class="secondary" type="reset">清空</button>
                <button type="submit">保存 Topic</button>
              </div>
            </form>
            <div id="topic-config-list"></div>
          </section>
        </div>
      </div>
    </div>
  </main>
  <div class="toast" id="toast"></div>
  <script src="/static/app.js"></script>
</body>
</html>
