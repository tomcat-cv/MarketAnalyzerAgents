<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Market Analyzer</title>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <header>
    <div>
      <h1>Market Analyzer</h1>
      <div class="subtle" id="clock">正在读取本地配置</div>
    </div>
    <div class="status-strip" id="market-status"></div>
  </header>
  <nav class="tabs" aria-label="主页面">
    <button class="tab-button active" data-tab="home" type="button">首页</button>
    <button class="tab-button" data-tab="archive" type="button">历史归档</button>
    <button class="tab-button" data-tab="config" type="button">配置</button>
  </nav>
  <main>
    <div class="tab-panel" id="tab-home">
      <div class="overview-grid" id="overview"></div>
      <div id="market-home-sections"></div>
    </div>
    <div class="tab-panel" id="tab-archive" hidden>
      <section>
        <div class="section-head">
          <h2>历史报告</h2>
          <span class="subtle">state/analysis/reports</span>
        </div>
        <h3>美股</h3><div class="brief-list" id="reports-us_equities"></div>
        <h3>A 股</h3><div class="brief-list" id="reports-a_share"></div>
      </section>
    </div>
    <div class="tab-panel" id="tab-config" hidden>
      <div class="config-stack">
        <section>
          <div class="section-head">
            <div><h2>基础大模型供应商</h2><span class="subtle">报告、盘中建议与辩论统一使用</span></div>
            <button class="secondary" id="edit-model" type="button">修改</button>
          </div>
          <div class="model-summary" id="model-summary"></div>
        </section>
        <div class="config-grid">
          <section>
            <div class="section-head">
              <div><h2>持仓配置</h2><span class="subtle">输入代码后自动核验并补全公司资料</span></div>
              <span class="subtle" id="holding-config-count"></span>
            </div>
            <form id="holding-form">
              <div class="form-grid">
                <div>
                  <label>市场</label>
                  <select name="market">
                    <option value="us_equities">美股</option>
                    <option value="a_share">A 股</option>
                  </select>
                </div>
                <div>
                  <label>代码</label>
                  <div class="input-action"><input name="ticker" required autocomplete="off"><button class="secondary" id="lookup-holding" type="button">核验</button></div>
                </div>
                <div><label>持有份额</label><input name="quantity" type="number" min="0" step="any" required></div>
                <div><label>单位成本价</label><input name="cost_basis" type="number" min="0" step="any" required></div>
              </div>
              <div class="profile-preview empty" id="holding-preview">核验后将显示中英文名称、业务领域和官方资讯来源。</div>
              <div class="actions">
                <button class="secondary" type="reset">清空</button>
                <button type="submit" disabled>添加持仓</button>
              </div>
            </form>
            <form id="portfolio-form">
              <div class="form-grid">
                <div><label>市场</label><select name="market"><option value="us_equities">美股</option><option value="a_share">A 股</option></select></div>
                <div><label>市场组合净值</label><input name="portfolio_nav" type="number" min="0.01" step="any" required></div>
                <div><label>币种</label><select name="currency"><option value="USD">USD</option><option value="CNY">CNY</option></select></div>
              </div>
              <div class="actions"><button type="submit">保存市场净值</button></div>
            </form>
            <div id="holding-config-list"></div>
          </section>
          <section>
            <div class="section-head">
              <div><h2>资讯与社媒来源</h2><span class="subtle">自动关键词与自定义关键词统一生效</span></div>
              <span class="subtle">官方资讯 / X / 小红书</span>
            </div>
            <form id="source-form">
              <div class="form-grid">
                <div class="wide">
                  <label>当前关注关键词</label>
                  <div class="keyword-editor" id="keyword-collection"></div>
                  <div class="input-action"><input name="new_keyword" placeholder="添加一个关键词"><button class="secondary" id="add-keyword" type="button">添加</button></div>
                </div>
                <div class="wide">
                  <label>官方 RSS 来源，每行：名称 | URL | 主题逗号分隔</label>
                  <textarea name="official_sources"></textarea>
                </div>
                <div>
                  <label>X 关注博主</label>
                  <textarea name="x_accounts"></textarea>
                </div>
                <div>
                  <label>X 关键词采集条数</label>
                  <input type="number" name="x_keyword_max_results" min="1" max="100" step="1" />
                </div>
                <div>
                  <label>X 每个博主采集条数</label>
                  <input type="number" name="x_account_max_results_per_account" min="1" max="100" step="1" />
                </div>
                <div>
                  <label>小红书关注博主</label>
                  <textarea name="xiaohongshu_accounts"></textarea>
                </div>
              </div>
              <div class="actions">
                <button type="submit">保存来源</button>
              </div>
            </form>
          </section>
        </div>
      </div>
    </div>
  </main>
  <dialog id="model-dialog">
    <form id="model-form">
      <div class="dialog-head"><div><h2>修改基础大模型供应商</h2><span class="subtle">API Key 不会在页面回显</span></div><button class="icon-button" id="close-model" type="button" aria-label="关闭">×</button></div>
      <div class="form-grid">
        <div class="wide"><label>供应商</label><select name="backend"><option value="zhipu">智谱</option><option value="openai">OpenAI</option><option value="dry-run">Dry run</option></select></div>
        <div><label id="provider-model-label">模型名称</label><input name="model"></div>
        <div><label id="provider-key-label">API Key</label><input name="api_key" type="password" autocomplete="new-password"></div>
        <div><label>讨论轮数</label><input name="debate_rounds" type="number" min="1" max="3" step="1"></div>
        <div><label>盘中建议间隔（秒）</label><input name="intraday_suggestion_interval_seconds" type="number" min="60" step="60"></div>
        <div class="wide"><label>默认报告时间</label><input name="report_schedule"></div>
      </div>
      <div class="actions"><button class="secondary" id="cancel-model" type="button">取消</button><button type="submit">保存配置</button></div>
    </form>
  </dialog>
  <div class="toast" id="toast"></div>
  <script src="/static/app.js"></script>
</body>
</html>
