services:
  marketanalyzeragents:
    build: .
    env_file:
      - .env
    environment:
      MARKET_ANALYZER_AGENTS_REPORT_SCHEDULE: "08:00,14:00,20:00"
      MARKET_ANALYZER_AGENTS_INTRADAY_INTERVAL_SECONDS: "1800"
    volumes:
      - ./config:/app/config:ro
      - ./state:/app/state
    command: ["marketanalyzeragents", "service"]
