services:
  dailyresearch:
    build: .
    env_file:
      - .env
    environment:
      DAILYRESEARCH_SCHEDULE_MODE: daily
      DAILYRESEARCH_SCHEDULE_TIME: "06:00"
      DAILYRESEARCH_RUN_ON_START: "false"
    volumes:
      - ./config:/app/config:ro
      - ./briefs:/app/briefs
      - ./runs:/app/runs
      - ./memory:/app/memory
    command: ["dailyresearch", "schedule"]
