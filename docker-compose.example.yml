services:
  marketanalyzeragents:
    build: .
    env_file:
      - .env
    environment:
      MARKET_ANALYZER_AGENTS_SCHEDULE_MODE: daily
      MARKET_ANALYZER_AGENTS_SCHEDULE_TIME: "06:00"
      MARKET_ANALYZER_AGENTS_RUN_ON_START: "false"
    volumes:
      - ./config:/app/config:ro
      - ./briefs:/app/briefs
      - ./runs:/app/runs
      - ./memory:/app/memory
    command: ["marketanalyzeragents", "schedule"]
